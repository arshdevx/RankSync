name: Build & Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Portable Executable
        run: npm run build:exe

      - name: Zip Executable Package
        run: |
          Compress-Archive -Path 'dist-electron/win-unpacked/*' -DestinationPath 'PCM-Tracker-Windows.zip' -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PCM-Tracker-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
